name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, reopened, synchronize, closed]

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.action != 'closed'

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Build application
        run: npm run build

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Detect changed test files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANGED=$(gh pr diff "$PR_NUMBER" --name-only | grep '^tests/.*\.spec\.ts$' || true)
          DELIMITER=$(openssl rand -hex 16)
          echo "CHANGED_TEST_FILES<<${DELIMITER}" >> "$GITHUB_ENV"
          echo "$CHANGED" >> "$GITHUB_ENV"
          echo "${DELIMITER}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (local)
        run: npx wrangler d1 migrations apply freedom-seed --local --env test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  publish-report:
    runs-on: ubuntu-latest
    needs: [playwright]
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      !cancelled()
    concurrency:
      group: pages-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Download Playwright report
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report/

      - name: Publish report to GitHub Pages
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: playwright-report/
          action: deploy

  cleanup-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    concurrency:
      group: pages-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Remove report preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: playwright-report/
          action: remove

  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false
    # if: github.event_name == 'pull_request'
    needs: [ci, playwright]
    outputs:
      preview-url: ${{ steps.extract-url.outputs.preview-url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload version to Cloudflare
        id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --tag pr-${{ github.event.number }}

      - name: Extract preview URL
        id: extract-url
        env:
          CMD_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          # Extract the preview URL from the output
          PREVIEW_URL=$(echo "$CMD_OUTPUT" | grep -o "Version Preview URL: https://[^ ]*" | cut -d' ' -f4)
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $PREVIEW_URL"

          # Output to step summary
          echo "## 🚀 Preview Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL:** [$PREVIEW_URL]($PREVIEW_URL)" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with preview URL
        if: steps.extract-url.outputs.preview-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} --body "🚀 **Preview Environment Ready!**

          Your changes are deployed and ready for testing:

          **Preview URL:** ${{ steps.extract-url.outputs.preview-url }}

          This preview will be available until the PR is merged or closed."

  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false
    # if:
    #   github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
    #   github.ref == 'refs/heads/master')
    needs: [ci, playwright]

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to production
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Output deployment success
        run: |
          echo "✅ Production deployment successful!"

          # Output to step summary
          echo "## 🎉 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status:** Successfully deployed to production" >> $GITHUB_STEP_SUMMARY
